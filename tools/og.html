<!doctype html>
<!--
  Source for public/assets/img/og-image.png (1200×630 link preview).
  Reuses the site's CSS and the real 3D stage. Regenerate: see README.
-->
<html lang="en" class="js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Link preview</title>
  <link rel="stylesheet" href="/public/assets/css/styles.css">
  <style>
    body { width: 1200px; height: 630px; overflow: hidden; }
    .og { position: relative; z-index: 2; height: 630px; padding: 52px 64px; display: flex; flex-direction: column; justify-content: space-between;
      background: radial-gradient(100% 90% at 0% 100%, rgb(10 10 15 / .95) 30%, transparent 62%); }
    .og .serif { font-size: 44px; color: var(--text); }
    .og h1 { font-weight: 800; text-transform: uppercase; font-size: 150px; line-height: .8; letter-spacing: -.045em; }
    .og .role { margin-top: 22px; font-size: 26px; color: var(--muted); max-width: 610px; line-height: 1.3; }
    .og .role b { color: var(--text); font-weight: 700; }
    .og-person { position: absolute; z-index: 1; right: -30px; bottom: 0; height: 560px; filter: drop-shadow(0 30px 60px rgb(0 0 0 / .6));
      /* the source photo is cut at the shoulders: dissolve the sides and bottom */
      -webkit-mask-image: radial-gradient(75% 92% at 50% 30%, #000 62%, transparent 92%); mask-image: radial-gradient(75% 92% at 50% 30%, #000 62%, transparent 92%); }
    .og-fade { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(transparent, #0a0a0f); }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"><canvas class="stage__canvas"></canvas><div class="stage__labels"></div></div>
  <img class="og-person" src="/photos/divya-patel-cutout-studio.png" alt="">
  <div class="og-fade"></div>
  <div class="og">
    <div style="display:flex;gap:18px;align-items:center">
      <p class="label">Backend &amp; Cloud Engineer</p>
      <p class="status"><span class="status__dot"></span>Open to remote roles</p>
    </div>
    <div>
      <p class="serif">Hi, I’m Divya.</p>
      <h1>Divya<br>Patel</h1>
      <p class="role"><b>Node.js, TypeScript &amp; AWS</b>: serverless APIs, Terraform, CI/CD, observability.</p>
    </div>
  </div>
  <script type="module" src="/tools/og.bundle.js"></script>
</body>
</html>
