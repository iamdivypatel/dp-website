<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" class="diagram" role="img" aria-labelledby="cost-breakdown-t cost-breakdown-d">
<title id="cost-breakdown-t">Where the money goes at 5B tokens a month</title>
<desc id="cost-breakdown-d">Stacked bars at 5 billion tokens a month: self-hosting costs about $1,601, mostly idle GPU time and engineering time; gpt-5-mini via API costs about $2,045; a hosted Llama 3.1 8B API costs about $109.</desc>
<text x="210" y="30" class="d-sub">Example month: 5B tokens, GPU busy about 17% of the time</text>
<line x1="210.0" y1="50" x2="210.0" y2="290" class="d-grid"/>
<text x="210.0" y="310" class="d-sub" text-anchor="middle">$0</text>
<line x1="345.0" y1="50" x2="345.0" y2="290" class="d-grid"/>
<text x="345.0" y="310" class="d-sub" text-anchor="middle">$600</text>
<line x1="480.0" y1="50" x2="480.0" y2="290" class="d-grid"/>
<text x="480.0" y="310" class="d-sub" text-anchor="middle">$1,200</text>
<line x1="615.0" y1="50" x2="615.0" y2="290" class="d-grid"/>
<text x="615.0" y="310" class="d-sub" text-anchor="middle">$1,800</text>
<line x1="750.0" y1="50" x2="750.0" y2="290" class="d-grid"/>
<text x="750.0" y="310" class="d-sub" text-anchor="middle">$2,400</text>
<text x="196" y="80" class="d-text" text-anchor="end">Self-host</text>
<text x="196" y="100" class="d-sub" text-anchor="end">1× L40S, 24/7</text>
<rect x="210.0" y="62" width="31.1" height="46" class="d-fill-accent"/>
<rect x="241.1" y="62" width="148.1" height="46" class="d-fill-warn"/>
<rect x="389.1" y="62" width="182.0" height="46" class="d-fill-cyan"/>
<text x="581.1" y="91" class="d-text">$1,601</text>
<text x="196" y="158" class="d-text" text-anchor="end">API</text>
<text x="196" y="178" class="d-sub" text-anchor="end">gpt-5-mini</text>
<rect x="210.0" y="140" width="460.1" height="46" class="d-fill-ok"/>
<text x="680.1" y="169" class="d-text">$2,045</text>
<text x="196" y="236" class="d-text" text-anchor="end">API</text>
<text x="196" y="256" class="d-sub" text-anchor="end">hosted Llama 3.1 8B</text>
<rect x="210.0" y="218" width="24.5" height="46" class="d-fill-ok"/>
<text x="244.5" y="247" class="d-text">$109</text>
<path d="M210 50V290" class="d-axis"/>
<rect x="210" y="338" width="14" height="14" class="d-fill-accent"/>
<text x="232" y="350" class="d-sub">GPU busy</text>
<rect x="310.0" y="338" width="14" height="14" class="d-fill-warn"/>
<text x="332.0" y="350" class="d-sub">GPU idle</text>
<rect x="410.0" y="338" width="14" height="14" class="d-fill-cyan"/>
<text x="432.0" y="350" class="d-sub">Ops time + storage</text>
<rect x="572" y="338" width="14" height="14" class="d-fill-ok"/>
<text x="594" y="350" class="d-sub">API bill</text>
</svg>
