<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" class="diagram" role="img" aria-labelledby="cache-patterns-t cache-patterns-d">
  <title id="cache-patterns-t">Cache-aside, write-through and write-behind</title>
  <desc id="cache-patterns-d">Three small flows side by side: cache-aside reads Redis and falls back to Aurora, write-through writes Aurora then Redis, write-behind writes Redis and flushes to Aurora later.</desc>
  <defs>
    <marker id="cache-patterns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker>
  </defs>

  <rect class="d-zone" x="16" y="16" width="240" height="328" rx="10"/>
  <text class="d-text" x="136" y="48" text-anchor="middle">Cache-aside</text>
  <rect class="d-box d-accent" x="76" y="76" width="120" height="50" rx="10"/>
  <text class="d-text" x="136" y="106" text-anchor="middle">App</text>
  <rect class="d-box d-cyan" x="32" y="216" width="92" height="50" rx="10"/>
  <text class="d-text" x="78" y="246" text-anchor="middle">Redis</text>
  <rect class="d-box" x="148" y="216" width="92" height="50" rx="10"/>
  <text class="d-text" x="194" y="246" text-anchor="middle">Aurora</text>
  <path class="d-edge d-edge-ok" d="M106 126L80 214" marker-end="url(#cache-patterns-arrow)"/>
  <text class="d-sub" x="86" y="174" text-anchor="end">1  read</text>
  <path class="d-edge d-edge-accent" d="M166 126L192 214" marker-end="url(#cache-patterns-arrow)"/>
  <text class="d-sub" x="186" y="174">2  on miss</text>
  <text class="d-sub" x="136" y="296" text-anchor="middle">miss: SELECT, then SET</text>
  <text class="d-sub" x="136" y="320" text-anchor="middle">write: DB, then DEL</text>

  <rect class="d-zone" x="280" y="16" width="240" height="328" rx="10"/>
  <text class="d-text" x="400" y="48" text-anchor="middle">Write-through</text>
  <rect class="d-box d-accent" x="340" y="76" width="120" height="50" rx="10"/>
  <text class="d-text" x="400" y="106" text-anchor="middle">App</text>
  <rect class="d-box d-cyan" x="296" y="216" width="92" height="50" rx="10"/>
  <text class="d-text" x="342" y="246" text-anchor="middle">Redis</text>
  <rect class="d-box" x="412" y="216" width="92" height="50" rx="10"/>
  <text class="d-text" x="458" y="246" text-anchor="middle">Aurora</text>
  <path class="d-edge d-edge-accent" d="M370 126L344 214" marker-end="url(#cache-patterns-arrow)"/>
  <text class="d-sub" x="350" y="174" text-anchor="end">2  SET</text>
  <path class="d-edge d-edge-accent" d="M430 126L456 214" marker-end="url(#cache-patterns-arrow)"/>
  <text class="d-sub" x="450" y="174">1  write</text>
  <text class="d-sub" x="400" y="296" text-anchor="middle">write DB, then cache</text>
  <text class="d-sub" x="400" y="320" text-anchor="middle">cache stays warm</text>

  <rect class="d-zone" x="544" y="16" width="240" height="328" rx="10"/>
  <text class="d-text" x="664" y="48" text-anchor="middle">Write-behind</text>
  <rect class="d-box d-accent" x="604" y="76" width="120" height="50" rx="10"/>
  <text class="d-text" x="664" y="106" text-anchor="middle">App</text>
  <rect class="d-box d-cyan" x="560" y="216" width="92" height="50" rx="10"/>
  <text class="d-text" x="606" y="246" text-anchor="middle">Redis</text>
  <rect class="d-box" x="676" y="216" width="92" height="50" rx="10"/>
  <text class="d-text" x="722" y="246" text-anchor="middle">Aurora</text>
  <path class="d-edge d-edge-accent" d="M634 126L608 214" marker-end="url(#cache-patterns-arrow)"/>
  <text class="d-sub" x="614" y="174" text-anchor="end">1  write</text>
  <path class="d-edge d-dashed" d="M652 241H674" marker-end="url(#cache-patterns-arrow)"/>
  <text class="d-sub" x="664" y="296" text-anchor="middle">2  async flush</text>
  <text class="d-sub" x="664" y="320" text-anchor="middle">fast, can lose writes</text>
</svg>
