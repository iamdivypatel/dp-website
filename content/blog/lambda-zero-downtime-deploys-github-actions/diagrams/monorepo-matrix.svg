<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" class="diagram" role="img" aria-labelledby="monorepo-matrix-t monorepo-matrix-d">
  <title id="monorepo-matrix-t">Deploy only changed functions</title>
  <desc id="monorepo-matrix-d">A git diff finds that the orders and billing folders changed and users did not, so the changes job outputs a list of two names and the matrix starts one deploy job each for orders and billing, with no job for users.</desc>
  <defs>
    <marker id="monorepo-matrix-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker>
  </defs>

  <!-- Repo -->
  <rect class="d-zone" x="20" y="30" width="210" height="260" rx="10"/>
  <text class="d-zone-label" x="36" y="52">functions/</text>

  <rect class="d-box d-accent" x="40" y="70" width="170" height="56" rx="10"/>
  <text class="d-text d-mono" x="125" y="94" text-anchor="middle">orders/</text>
  <text class="d-sub" x="125" y="114" text-anchor="middle">changed</text>

  <rect class="d-box d-accent" x="40" y="150" width="170" height="56" rx="10"/>
  <text class="d-text d-mono" x="125" y="174" text-anchor="middle">billing/</text>
  <text class="d-sub" x="125" y="194" text-anchor="middle">changed</text>

  <rect class="d-box" x="40" y="230" width="170" height="44" rx="10"/>
  <text class="d-sub d-mono" x="125" y="257" text-anchor="middle">users/  no change</text>

  <!-- Changes job -->
  <rect class="d-box" x="310" y="128" width="200" height="76" rx="10"/>
  <text class="d-text" x="410" y="158" text-anchor="middle">changes job</text>
  <text class="d-sub d-mono" x="410" y="182" text-anchor="middle">["orders","billing"]</text>

  <line class="d-edge" x1="230" y1="166" x2="310" y2="166" marker-end="url(#monorepo-matrix-arrow)"/>
  <text class="d-sub" x="270" y="156" text-anchor="middle">git diff</text>

  <!-- Matrix -->
  <rect class="d-box d-ok" x="590" y="40" width="190" height="64" rx="10"/>
  <text class="d-text" x="685" y="68" text-anchor="middle">deploy orders</text>
  <text class="d-sub" x="685" y="88" text-anchor="middle">own canary</text>

  <rect class="d-box d-ok" x="590" y="134" width="190" height="64" rx="10"/>
  <text class="d-text" x="685" y="162" text-anchor="middle">deploy billing</text>
  <text class="d-sub" x="685" y="182" text-anchor="middle">own canary</text>

  <rect class="d-box" x="590" y="228" width="190" height="52" rx="10"/>
  <text class="d-sub" x="685" y="259" text-anchor="middle">users: no job</text>

  <line class="d-edge d-edge-ok" x1="510" y1="150" x2="590" y2="76" marker-end="url(#monorepo-matrix-arrow)"/>
  <line class="d-edge d-edge-ok" x1="510" y1="166" x2="590" y2="166" marker-end="url(#monorepo-matrix-arrow)"/>
  <text class="d-sub" x="550" y="200" text-anchor="middle">matrix</text>
</svg>
