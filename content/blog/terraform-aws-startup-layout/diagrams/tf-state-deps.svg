<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" class="diagram" role="img" aria-labelledby="tf-state-deps-t tf-state-deps-d">
  <title id="tf-state-deps-t">State dependency graph</title>
  <desc id="tf-state-deps-d">The network, data, app and edge states are applied in that order; each one publishes outputs to SSM Parameter Store for the next to read, or the next one reads its state directly through terraform_remote_state.</desc>
  <defs>
    <marker id="tf-state-deps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker>
  </defs>

  <!-- Apply order -->
  <text x="24" y="34" class="d-sub">apply order</text>
  <text x="776" y="34" class="d-sub" text-anchor="end">destroy runs in reverse</text>
  <line x1="24" y1="50" x2="776" y2="50" class="d-edge d-edge-accent" marker-end="url(#tf-state-deps-arrow)"/>

  <circle cx="99" cy="84" r="11" class="d-num"/>
  <text x="99" y="84" class="d-num-text">1</text>
  <circle cx="299" cy="84" r="11" class="d-num"/>
  <text x="299" y="84" class="d-num-text">2</text>
  <circle cx="499" cy="84" r="11" class="d-num"/>
  <text x="499" y="84" class="d-num-text">3</text>
  <circle cx="699" cy="84" r="11" class="d-num"/>
  <text x="699" y="84" class="d-num-text">4</text>

  <!-- Stacks -->
  <rect x="24" y="110" width="150" height="70" rx="10" class="d-box d-accent"/>
  <text x="99" y="140" class="d-text d-mono" text-anchor="middle">network</text>
  <text x="99" y="161" class="d-sub" text-anchor="middle">VPC, subnets</text>
  <rect x="224" y="110" width="150" height="70" rx="10" class="d-box d-accent" data-logo="aws-aurora"/>
  <text x="299" y="140" class="d-text d-mono" text-anchor="middle">data</text>
  <text x="299" y="161" class="d-sub" text-anchor="middle">Aurora, Redis, S3</text>
  <rect x="424" y="110" width="150" height="70" rx="10" class="d-box d-accent" data-logo="aws-lambda"/>
  <text x="499" y="140" class="d-text d-mono" text-anchor="middle">app</text>
  <text x="499" y="161" class="d-sub" text-anchor="middle">Lambda, API, SQS</text>
  <rect x="624" y="110" width="150" height="70" rx="10" class="d-box d-accent"/>
  <text x="699" y="140" class="d-text d-mono" text-anchor="middle">edge</text>
  <text x="699" y="161" class="d-sub" text-anchor="middle">CloudFront, WAF</text>

  <!-- remote_state reads (dashed, direct) -->
  <line x1="174" y1="145" x2="224" y2="145" class="d-edge d-dashed" marker-end="url(#tf-state-deps-arrow)"/>
  <line x1="374" y1="145" x2="424" y2="145" class="d-edge d-dashed" marker-end="url(#tf-state-deps-arrow)"/>
  <line x1="574" y1="145" x2="624" y2="145" class="d-edge d-dashed" marker-end="url(#tf-state-deps-arrow)"/>

  <!-- SSM band -->
  <rect x="24" y="250" width="750" height="72" rx="10" class="d-box d-cyan" data-logo="aws-systems-manager"/>
  <text x="400" y="276" class="d-text" text-anchor="middle">SSM Parameter Store</text>
  <text x="99" y="304" class="d-sub d-mono" text-anchor="middle">/prod/network/*</text>
  <text x="299" y="304" class="d-sub d-mono" text-anchor="middle">/prod/data/*</text>
  <text x="499" y="304" class="d-sub d-mono" text-anchor="middle">/prod/app/*</text>

  <!-- writes (down) and reads (up) -->
  <line x1="99" y1="180" x2="99" y2="250" class="d-edge d-edge-ok" marker-end="url(#tf-state-deps-arrow)"/>
  <line x1="279" y1="250" x2="279" y2="180" class="d-edge d-edge-accent" marker-end="url(#tf-state-deps-arrow)"/>
  <line x1="319" y1="180" x2="319" y2="250" class="d-edge d-edge-ok" marker-end="url(#tf-state-deps-arrow)"/>
  <line x1="479" y1="250" x2="479" y2="180" class="d-edge d-edge-accent" marker-end="url(#tf-state-deps-arrow)"/>
  <line x1="519" y1="180" x2="519" y2="250" class="d-edge d-edge-ok" marker-end="url(#tf-state-deps-arrow)"/>
  <line x1="699" y1="250" x2="699" y2="180" class="d-edge d-edge-accent" marker-end="url(#tf-state-deps-arrow)"/>

  <!-- Legend -->
  <line x1="24" y1="364" x2="64" y2="364" class="d-edge d-edge-ok" marker-end="url(#tf-state-deps-arrow)"/>
  <text x="74" y="368" class="d-sub">writes output</text>
  <line x1="214" y1="364" x2="254" y2="364" class="d-edge d-edge-accent" marker-end="url(#tf-state-deps-arrow)"/>
  <text x="264" y="368" class="d-sub">reads input</text>
  <line x1="394" y1="364" x2="434" y2="364" class="d-edge d-dashed" marker-end="url(#tf-state-deps-arrow)"/>
  <text x="444" y="368" class="d-sub d-mono">terraform_remote_state</text>
</svg>
