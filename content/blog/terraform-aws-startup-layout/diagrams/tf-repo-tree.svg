<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" class="diagram" role="img" aria-labelledby="tf-repo-tree-t tf-repo-tree-d">
  <title id="tf-repo-tree-t">Repository layout</title>
  <desc id="tf-repo-tree-d">An infra repository with three folders: envs holding per-environment backend and tfvars files, stacks holding the network, data, app and edge root modules, and modules holding your own reusable modules next to pinned registry modules.</desc>

  <!-- Root -->
  <rect x="330" y="20" width="140" height="40" rx="10" class="d-box d-accent"/>
  <text x="400" y="45" class="d-text d-mono" text-anchor="middle">infra/</text>

  <!-- Tree lines -->
  <path d="M400 60V84M140 84H660M140 84V110M400 84V110M660 84V110" class="d-edge"/>

  <!-- envs -->
  <rect x="24" y="110" width="232" height="342" rx="10" class="d-zone"/>
  <text x="40" y="129" class="d-zone-label d-mono">envs/</text>
  <rect x="40" y="140" width="200" height="136" rx="10" class="d-box"/>
  <text x="140" y="166" class="d-text d-mono" text-anchor="middle">prod/</text>
  <text x="140" y="192" class="d-sub d-mono" text-anchor="middle">backend.hcl</text>
  <text x="140" y="210" class="d-sub d-mono" text-anchor="middle">network.tfvars</text>
  <text x="140" y="228" class="d-sub d-mono" text-anchor="middle">data.tfvars</text>
  <text x="140" y="246" class="d-sub d-mono" text-anchor="middle">app.tfvars</text>
  <text x="140" y="264" class="d-sub d-mono" text-anchor="middle">edge.tfvars</text>
  <rect x="40" y="300" width="200" height="136" rx="10" class="d-box"/>
  <text x="140" y="326" class="d-text d-mono" text-anchor="middle">staging/</text>
  <text x="140" y="352" class="d-sub d-mono" text-anchor="middle">backend.hcl</text>
  <text x="140" y="370" class="d-sub d-mono" text-anchor="middle">network.tfvars</text>
  <text x="140" y="388" class="d-sub d-mono" text-anchor="middle">data.tfvars</text>
  <text x="140" y="406" class="d-sub d-mono" text-anchor="middle">app.tfvars</text>
  <text x="140" y="424" class="d-sub d-mono" text-anchor="middle">edge.tfvars</text>

  <!-- stacks -->
  <rect x="284" y="110" width="232" height="342" rx="10" class="d-zone"/>
  <text x="300" y="129" class="d-zone-label d-mono">stacks/</text>
  <rect x="300" y="140" width="200" height="56" rx="10" class="d-box d-accent"/>
  <text x="400" y="164" class="d-text d-mono" text-anchor="middle">network/</text>
  <text x="400" y="184" class="d-sub" text-anchor="middle">VPC, subnets, endpoints</text>
  <rect x="300" y="220" width="200" height="56" rx="10" class="d-box d-accent"/>
  <text x="400" y="244" class="d-text d-mono" text-anchor="middle">data/</text>
  <text x="400" y="264" class="d-sub" text-anchor="middle">Aurora, Redis, S3</text>
  <rect x="300" y="300" width="200" height="56" rx="10" class="d-box d-accent"/>
  <text x="400" y="324" class="d-text d-mono" text-anchor="middle">app/</text>
  <text x="400" y="344" class="d-sub" text-anchor="middle">Lambda, API GW, SQS</text>
  <rect x="300" y="380" width="200" height="56" rx="10" class="d-box d-accent"/>
  <text x="400" y="404" class="d-text d-mono" text-anchor="middle">edge/</text>
  <text x="400" y="424" class="d-sub" text-anchor="middle">CloudFront, WAF, DNS</text>

  <!-- modules -->
  <rect x="544" y="110" width="232" height="342" rx="10" class="d-zone"/>
  <text x="560" y="129" class="d-zone-label d-mono">modules/</text>
  <rect x="560" y="140" width="200" height="56" rx="10" class="d-box"/>
  <text x="660" y="164" class="d-text d-mono" text-anchor="middle">lambda-service/</text>
  <text x="660" y="184" class="d-sub" text-anchor="middle">function, role, logs</text>
  <rect x="560" y="220" width="200" height="56" rx="10" class="d-box"/>
  <text x="660" y="244" class="d-text d-mono" text-anchor="middle">queue-worker/</text>
  <text x="660" y="264" class="d-sub" text-anchor="middle">SQS, DLQ, alarms</text>
  <rect x="560" y="300" width="200" height="56" rx="10" class="d-box"/>
  <text x="660" y="324" class="d-text d-mono" text-anchor="middle">static-site/</text>
  <text x="660" y="344" class="d-sub" text-anchor="middle">S3 origin, OAC</text>
  <rect x="560" y="380" width="200" height="56" rx="10" class="d-box d-cyan"/>
  <text x="660" y="404" class="d-text" text-anchor="middle">registry modules</text>
  <text x="660" y="424" class="d-sub" text-anchor="middle">pinned versions</text>
</svg>
